<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f5" />
    <script>
      // החלת מצב כהה לפני ציור העמוד כדי למנוע הבהוב
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', dark ? '#000000' : '#f2f2f5');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="ארון המשפחה – ניהול בגדי הילדים: מה יש, לאיזה גיל ולאיזו עונה" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ארון המשפחה</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
